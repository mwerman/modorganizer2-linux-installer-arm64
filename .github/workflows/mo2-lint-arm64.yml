name: MO2-LINT AppImage + Flatpak arm64
run-name: MO2-LINT arm64 build (${{ inputs.ref }})
on:
  workflow_dispatch:
    inputs:
      ref:
        description: MO2-LINT branch or tag
        default: main
permissions:
  contents: write
jobs:
  build:
    name: Build AppImage and Flatpak (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Furglitch/modorganizer2-linux-installer
          ref: ${{ inputs.ref }}
          path: mo2
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder curl file

      - name: Build shared app directory
        run: |
          set -e
          PYV="$(tr -d '[:space:]' < mo2/.python-version 2>/dev/null || true)"
          PYV="${PYV:-3.12}"
          uv python install "$PYV"
          PY="$(uv python find "$PYV")"
          PYROOT="$(dirname "$(dirname "$(readlink -f "$PY")")")"
          mkdir -p AppDir/usr/bin
          cp -a "$PYROOT" AppDir/usr/python
          uv pip install --python AppDir/usr/python/bin/python3 --break-system-packages ./mo2
          NAME="$(AppDir/usr/python/bin/python3 - <<'PY'
          import tomllib
          d = tomllib.load(open("mo2/pyproject.toml", "rb"))
          s = d.get("project", {}).get("scripts", {})
          print("mo2-lint" if "mo2-lint" in s else (next(iter(s)) if s else ""))
          PY
          )"
          test -n "$NAME"
          echo "Entry point: $NAME"
          echo "$NAME" > AppDir/usr/entry-name
          cat > AppDir/usr/bin/mo2-lint <<'EOF'
          #!/bin/bash
          ROOT="$(cd "$(dirname "$(readlink -f "$0")")/.." && pwd)"
          export MO2_ENTRY="$(cat "$ROOT/entry-name")"
          exec "$ROOT/python/bin/python3" -c 'import os,sys
          from importlib.metadata import entry_points
          n=os.environ["MO2_ENTRY"]
          ep=[x for x in entry_points(group="console_scripts") if x.name==n][0]
          sys.argv[0]=n
          sys.exit(ep.load()())' "$@"
          EOF
          chmod +x AppDir/usr/bin/mo2-lint
          AppDir/usr/bin/mo2-lint --help || echo "WARNING: --help failed"

      - name: Make AppImage
        run: |
          set -e
          cp -a AppDir AppImageDir
          echo iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg== | base64 -d > AppImageDir/mo2-lint.png
          cat > AppImageDir/mo2-lint.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MO2-LINT
          Exec=mo2-lint
          Icon=mo2-lint
          Terminal=true
          Categories=Game;Utility;
          EOF
          cat > AppImageDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/mo2-lint" "$@"
          EOF
          chmod +x AppImageDir/AppRun
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool
          ARCH=aarch64 ./appimagetool --appimage-extract-and-run AppImageDir MO2-LINT-arm64.AppImage

      - name: Make Flatpak
        run: |
          set -e
          cat > flatpak-mo2lint.yml <<'EOF'
          app-id: local.dev.Mo2Lint
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: mo2-lint
          finish-args:
            - --share=network
            - --share=ipc
            - --filesystem=home
          modules:
            - name: mo2-lint
              buildsystem: simple
              build-commands:
                - cp -a payload/. /app/
              sources:
                - type: dir
                  path: AppDir/usr
                  dest: payload
          EOF
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --arch=aarch64 --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=repo build-dir flatpak-mo2lint.yml
          flatpak build-bundle --arch=aarch64 --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo MO2-LINT-arm64.flatpak local.dev.Mo2Lint

      - name: Check architecture
        run: file MO2-LINT-arm64.AppImage AppDir/usr/python/bin/python3*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mo2-lint-arm64
          files: |
            MO2-LINT-arm64.AppImage
            MO2-LINT-arm64.flatpak
