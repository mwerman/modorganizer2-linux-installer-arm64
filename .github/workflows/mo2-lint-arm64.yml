name: MO2-LINT AppImage + Flatpak arm64
run-name: MO2-LINT arm64 build (${{ inputs.ref }})
on:
  workflow_dispatch:
    inputs:
      ref:
        description: MO2-LINT branch or tag
        default: main
permissions:
  contents: write
jobs:
  build:
    name: Build AppImage and Flatpak (aarch64)
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Furglitch/modorganizer2-linux-installer
          ref: ${{ inputs.ref }}
          path: mo2
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y make flatpak flatpak-builder curl file

      - name: Fetch prebuilt Windows redirector (best effort)
        run: |
          mkdir -p mo2/dist
          TAG="$(gh release list --repo Furglitch/modorganizer2-linux-installer --limit 1 --json tagName -q '.[0].tagName' || true)"
          echo "Latest release tag: $TAG"
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo Furglitch/modorganizer2-linux-installer --pattern '*redirector*' --dir mo2/dist || echo "WARNING: no redirector asset found"
          fi
          ls -la mo2/dist

      - name: Build mo2-lint with PyInstaller (native arm64)
        run: |
          set -e
          make -C mo2 -o redirector mo2-lint
          ls -la mo2/dist
          file mo2/dist/mo2-lint

      - name: Make AppImage
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          install -Dm755 mo2/dist/mo2-lint AppDir/usr/bin/mo2-lint
          echo iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg== | base64 -d > AppDir/mo2-lint.png
          cat > AppDir/mo2-lint.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MO2-LINT
          Exec=mo2-lint
          Icon=mo2-lint
          Terminal=true
          Categories=Game;Utility;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/mo2-lint" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool
          ARCH=aarch64 ./appimagetool --appimage-extract-and-run AppDir MO2-LINT-arm64.AppImage

      - name: Make Flatpak
        run: |
          set -e
          cp mo2/dist/mo2-lint ./mo2-lint
          cat > flatpak-mo2lint.yml <<'EOF'
          app-id: local.dev.Mo2Lint
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: mo2-lint
          fin
